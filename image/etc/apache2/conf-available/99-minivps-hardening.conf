# minivps-web-appliance: Apache の最小ハードニング。
# build/build-golden-image.sh が conf-available へ配置し、a2enconf で有効化する。
#
# コンテンツ側(DocumentRoot・VirtualHost)は既定のまま触らない。このアプライアンスの
# 目的はweb層とDB層のセグメント分離を成立させることで、サイトの中身は別途載せる。
#
# 3つともcoreディレクティブでモジュール非依存。tests/check-apache-conf.sh が
# LoadModule 無しの最小configで検証できるのはそのため。

# バージョン番号やOS名をレスポンスヘッダに出さない。
ServerTokens Prod

# エラーページのフッタにサーバ署名を出さない。
ServerSignature Off

# TRACEメソッドを無効化する。
TraceEnable Off
