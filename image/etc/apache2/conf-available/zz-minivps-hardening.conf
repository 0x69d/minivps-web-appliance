# minivps-web-appliance: Apache の最小ハードニング。
# build/build-golden-image.sh が conf-available へ配置し、a2enconf で有効化する。
#
# コンテンツ側(DocumentRoot・VirtualHost)は既定のまま触らない。このアプライアンスの
# 目的はweb層とDB層のセグメント分離を成立させることで、サイトの中身は別途載せる。
#
# ファイル名の zz- 接頭辞は必須。conf-enabled/*.conf はアルファベット順に読まれ、
# 同じディレクティブは後に読まれた方が勝つ。パッケージ同梱の security.conf が
# ServerTokens OS と ServerSignature On を持つため、99- のような数字接頭辞だと
# security.conf より先に読まれて上書きされ、設定が黙って無効になる。
#
# 3つともcoreディレクティブでモジュール非依存。

# バージョン番号やOS名をレスポンスヘッダに出さない。
ServerTokens Prod

# エラーページのフッタにサーバ署名を出さない。
ServerSignature Off

# TRACEメソッドを無効化する。
TraceEnable Off
