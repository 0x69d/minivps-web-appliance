#!/usr/sbin/nft -f
# minivps-web-appliance 既定ruleset。
#
# 方針: デフォルト拒否 + 許可リスト(minivps-dns-applianceと同型)。
# このVMはルーティングを行わないため、router版にあった forward chain の
# 許可リスト分離と sysctl の ip_forward 設定は同梱しない。

flush ruleset

table inet filter {
    # 管理アクセス許可元。specs/web-1.yamlのdefault NIC(192.168.122.0/24)からのみ。
    define MGMT_NET = 192.168.122.0/24

    chain input {
        type filter hook input priority filter; policy drop;

        iif "lo" accept
        ct state established,related accept
        ct state invalid drop

        # 診断用: pingを許可する。
        icmp type { echo-request, destination-unreachable, time-exceeded } accept

        # HTTP/HTTPSは送信元を問わず許可する。web公開がこのVMの目的のため。
        # 443はTLS終端が未設定でも先に開けておく。後から設定するときに
        # ゴールデンイメージの再ビルドを要さないようにするため。
        tcp dport { 80, 443 } accept

        # SSH管理アクセスはdefaultセグメントからのみ許可。
        ip saddr $MGMT_NET tcp dport 22 accept
    }

    chain forward {
        # このVMは転送しない。設定ミスでip forwardingが有効になっても
        # 通過させないよう明示的に全拒否する。
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        # egressは制限しない。
        type filter hook output priority filter; policy accept;
    }
}
